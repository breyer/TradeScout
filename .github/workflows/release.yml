name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --name TradeScout `
            --hidden-import pyscreeze `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import matplotlib `
            --hidden-import matplotlib.backends.backend_agg `
            Trade_Scout.py

      - name: Package release archive
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item dist\TradeScout.exe release\
          Copy-Item config\config.demo.yaml release\config.demo.yaml
          & "C:\Program Files\7-Zip\7z.exe" a TradeScout.7z .\release\*

      - name: Build NSIS installer
        run: |
          choco install nsis --version=3.09 -y --no-progress
          $env:PATH += ";C:\Program Files (x86)\NSIS"
          $date = Get-Date -Format 'yyyy.MM.dd'
          $sha = "${{ github.sha }}".Substring(0, 7)
          $version = "v$date-$sha"
          # Stage files where the NSI script expects them
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item dist\TradeScout.exe dist\TradeScout.exe -ErrorAction SilentlyContinue
          Set-Location installer
          makensis /DVERSION=$version tradescout.nsi
          Set-Location ..

      - name: Get version (date + short SHA)
        id: version
        run: |
          $date = Get-Date -Format 'yyyy.MM.dd'
          $sha = "${{ github.sha }}".Substring(0, 7)
          echo "tag=v$date-$sha" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TradeScout ${{ steps.version.outputs.tag }}
          body: |
            ## TradeScout ${{ steps.version.outputs.tag }}

            ### Installation

            #### Recommended — Windows Installer
            1. Download `TradeScout-Setup.exe` and run it
            2. The installer auto-detects your TAT folder, asks for your Discord webhook URL, and optionally sets up a scheduled task to run at 4:15 PM (Eastern Time) on weekdays
            3. Done — no manual config editing required

            #### Manual — Portable Archive
            1. Download `TradeScout.7z` and extract it
            2. Copy `config.demo.yaml` to `config\config.yaml` and fill in `db_path` and your Discord webhook URL
            3. Run `TradeScout.exe`

            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full usage.

            ---

            ### What's New

            #### 🪟 Windows Installer (`TradeScout-Setup.exe`)
            - Auto-detects your TAT installation directory
            - Collects your Discord webhook URL during setup (or you can add it later)
            - Optional checkboxes to enable/disable Equity Curve and Rolling Benchmarks
            - Optional Windows Scheduled Task at 4:15 PM ET on weekdays
            - Clean uninstaller via Add/Remove Programs

            #### 📅 Trading-Day Rolling Benchmarks
            Rolling windows (5d / 20d / 60d) now count **trading days**, not calendar days.
            Weekends and market holidays are automatically excluded.

            #### 🚫 Skip Closed-Market Days
            TradeScout detects when the market was closed (no trades and no DailyLog data)
            and exits silently without posting. Configurable via `features.skip_closed_market`.

            #### ⚙️ Feature Flags in `config.yaml`
            ```yaml
            features:
              equity_curve:
                enabled: true
                days: 60
              rolling_benchmarks:
                enabled: true
                windows: [5, 20, 60]   # trading days
              skip_closed_market:
                enabled: true
            ```
          files: |
            TradeScout.7z
            TradeScout-Setup.exe
          make_latest: true
