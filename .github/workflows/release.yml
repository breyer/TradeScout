name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --name TradeScout `
            --hidden-import pyscreeze `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import matplotlib `
            --hidden-import matplotlib.backends.backend_agg `
            Trade_Scout.py

      - name: Package release archive
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item dist\TradeScout.exe release\
          Copy-Item config\config.demo.yaml release\config.demo.yaml
          & "C:\Program Files\7-Zip\7z.exe" a TradeScout.7z .\release\*

      - name: Get version (date + short SHA)
        id: version
        run: |
          $date = Get-Date -Format 'yyyy.MM.dd'
          $sha = "${{ github.sha }}".Substring(0, 7)
          echo "tag=v$date-$sha" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TradeScout ${{ steps.version.outputs.tag }} — Equity Curve & Rolling Benchmarks
          body: |
            ## TradeScout ${{ steps.version.outputs.tag }}

            ### Installation
            1. Download `TradeScout.7z` and extract it
            2. Copy `config.demo.yaml` to `config.yaml` and fill in your `db_path` and Discord webhooks
            3. Run `TradeScout.exe`

            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full usage.

            ---

            ### What's New

            #### 📈 Equity Curve Chart
            TradeScout now generates a cumulative P&L equity curve and **attaches it as an image** to every daily Discord report.

            - Plots the last **60 calendar days** of trade P&L as a line chart with green/red fill above and below zero
            - Dark-themed, clean layout — renders nicely in Discord's image preview
            - Configurable look-back window via `config.yaml`

            #### 📊 Rolling Performance Benchmarks
            The daily report now includes a **rolling metrics table** appended below the main stats block, showing how today's numbers compare to your recent average:

            ```
            ----------|--------|--------|--------
            Rolling   |   5d   |  20d   |  60d
            ----------|--------|--------|--------
            PCR       | 82.1%  | 78.4%  | 76.9%
            Win %     | 86.7%  | 84.2%  | 81.5%
            Avg Day   |  $930  |  $810  |  $740
            ```

            Windows default to 5 / 20 / 60 calendar days and are fully configurable.

            #### ⚙️ Feature Flags in `config.yaml`
            Both new features are **enabled by default** and can be toggled or tuned in `config.yaml`:

            ```yaml
            features:
              equity_curve:
                enabled: true
                days: 60
              rolling_benchmarks:
                enabled: true
                windows: [5, 20, 60]
            ```

            Set `enabled: false` for either feature to revert to the previous report style.

            ---

            ### Dependencies
            - `matplotlib 3.10.1` *(new — required for equity curve chart)*

            ---

            ### Installation Note
            This release uses `--onedir` packaging. Extract `TradeScout.7z` and run `TradeScout.exe` from inside the extracted folder. Do not move the EXE out of the folder — it needs the bundled libraries alongside it.
          files: TradeScout.7z
          make_latest: true
