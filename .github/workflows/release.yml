name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --name TradeScout `
            --hidden-import pyscreeze `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            Trade_Scout.py

      - name: Package release archive
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item dist\TradeScout.exe release\
          Copy-Item config\config.demo.yaml release\config.demo.yaml
          & "C:\Program Files\7-Zip\7z.exe" a TradeScout.7z .\release\*

      - name: Get version (date + short SHA)
        id: version
        run: |
          $date = Get-Date -Format 'yyyy.MM.dd'
          $sha = "${{ github.sha }}".Substring(0, 7)
          echo "tag=v$date-$sha" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TradeScout ${{ steps.version.outputs.tag }} (SPX year fix + fast startup)
          body: |
            ## TradeScout ${{ steps.version.outputs.tag }}

            ### Installation
            1. Download `TradeScout.7z` and extract it
            2. Copy `config.demo.yaml` to `config.yaml` and fill in your `db_path` and Discord webhooks
            3. Run `TradeScout.exe`

            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full usage.

            ---

            ### What's Changed

            #### Bug Fixes
            - **SPX wrong value** — `get_last_spx_value` now queries raw .NET DateTime tick bounds, completely bypassing the year-forcing logic that caused same month/day entries from prior years to be returned instead of the correct year's entry
            - **EXE slow start / `--help` freezing** — switched from `--onefile` to `--onedir` PyInstaller mode; no more temp-dir extraction on launch, startup is near-instant
            - **Screenshot not posting** — `send_message_to_discord` was never called in the main flow; now wired up correctly
            - **Wrong trade types** — queries used `'Put'`/`'Call'` but the database stores `'PutSpread'`/`'CallSpread'`; fixed throughout
            - **Screenshot missing Pillow** — added `Pillow` and `pyscreeze` as explicit dependencies so PyInstaller bundles them
            - **SQL injection** — all database queries now use parameterized statements
            - **`delete_messages` wrong webhook** — was always using `webhooks[0]` for every message; now correctly paired per webhook
            - **`get_most_recent_monday` Sunday bug** — formula returned the same Sunday instead of rolling back to Monday
            - **No request timeout** — Discord HTTP calls could hang indefinitely; 10 s timeout added

            #### New Features
            - **IronFly trades** included in the weekly summary report
            - **`--win max` is now the default** (was `restore`)
            - **`--noimage` and `--debug` flags** added to the CLI
            - **Automated Windows build & release** via GitHub Actions on every push to `main`

            #### Performance
            - Single database connection per run (was 4 separate open/close cycles)
            - FILETIME column arithmetic vectorized with NumPy
            - Bad-slippage calculation vectorized (removed row-by-row `apply`)

            #### Dependencies (all updated to latest)
            - `pandas` 1.5.3 → 3.0.2
            - `requests` 2.28.1 → 2.33.1
            - `pyautogui` 0.9.53 → 0.9.54
            - `PyYAML` 6.0 → 6.0.3
            - `pyscreeze` 1.0.1 *(new — required for screenshot support)*
            - `Pillow` 12.2.0 *(new — required for screenshot support)*

            #### Code Quality
            - Comprehensive test suite added: 132 unit + integration tests
            - Lazy imports for GUI packages so the tool can run headless in tests
            - All `print()` calls replaced with `logging`
            - Type hints added throughout

            #### Installation Note
            This release uses `--onedir` packaging. Extract `TradeScout.7z` and run `TradeScout.exe` from inside the extracted folder. Do not move the EXE out of the folder — it needs the bundled libraries alongside it.
          files: TradeScout.7z
          make_latest: true
