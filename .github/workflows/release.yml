name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --name TradeScout `
            --hidden-import pyscreeze `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import matplotlib `
            --hidden-import matplotlib.backends.backend_agg `
            Trade_Scout.py

      - name: Package release archive
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item dist\TradeScout.exe release\
          Copy-Item config\config.demo.yaml release\config.demo.yaml
          & "C:\Program Files\7-Zip\7z.exe" a TradeScout.7z .\release\*

      - name: Build NSIS installer
        run: |
          choco install nsis --version=3.09 -y --no-progress
          $env:PATH += ";C:\Program Files (x86)\NSIS"
          $date = Get-Date -Format 'yyyy.MM.dd'
          $sha = "${{ github.sha }}".Substring(0, 7)
          $version = "v$date-$sha"
          # Stage files where the NSI script expects them
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item dist\TradeScout.exe dist\TradeScout.exe -ErrorAction SilentlyContinue
          Set-Location installer
          makensis /DVERSION=$version tradescout.nsi
          Set-Location ..

      - name: Get version (date + short SHA)
        id: version
        run: |
          $date = Get-Date -Format 'yyyy.MM.dd'
          $sha = "${{ github.sha }}".Substring(0, 7)
          echo "tag=v$date-$sha" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TradeScout ${{ steps.version.outputs.tag }}
          body: |
            ## TradeScout ${{ steps.version.outputs.tag }}

            Reads your daily options trades from Trade Automation Toolbox (TAT) and posts a formatted performance summary to Discord — automatically, every trading day.

            ---

            ### Installation

            #### Recommended — Windows Installer
            1. Download `TradeScout-Setup.exe` and run it
            2. The wizard will:
               - Auto-detect your TAT installation and set the correct `data.db3` path
               - Validate and save your Discord webhook URL
               - Let you enable/disable the equity curve and rolling benchmarks
               - Optionally create a Scheduled Task that runs at **4:35 PM ET** on weekdays
            3. Done — no manual config editing required

            #### Manual — Portable Archive
            1. Download `TradeScout.7z` and extract it
            2. Copy `config.demo.yaml` to `config.yaml` (next to `TradeScout.exe`) and set `db_path` to your TAT `data.db3`
            3. Run `TradeScout.exe`

            > `data.db3` is located at `%LOCALAPPDATA%\Packages\TradeAutomationToolbox_...\LocalState\`

            See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full configuration reference.

            ---

            ### What TradeScout Reports

            Every trading day a Discord message is posted with:

            - **SPX Last** — last index value for the session
            - **Premium Sold / Captured / PCR** — premium metrics
            - **Win %**, **Exp : Stp**, **Bad Slip**, **-ve Exprd** — trade quality
            - **WTD PL / MTD PL** — week-to-date and month-to-date P&L
            - **Rolling benchmarks** — PCR, Win %, and avg daily P&L over 5 / 20 / 60 **trading days**
            - **Equity curve chart** — 60-day cumulative P&L chart attached every Friday (or the next open market day if Friday was a holiday)

            ---

            ### Feature Flags (`config.yaml`)

            ```yaml
            features:
              equity_curve:
                enabled: true
                days: 60                   # look-back window for the chart
              rolling_benchmarks:
                enabled: true
                windows: [5, 20, 60]       # trading days
              skip_closed_market:
                enabled: true              # exit silently on market holidays
            ```

            ---

            ### Changelog

            #### Weekly Equity Curve
            The equity curve chart is now attached on **Fridays only** (or the first open market day after a closed Friday). Previously it was attached every day.

            #### Webhook URL Validation
            The installer now validates that the entered URL starts with `https://discord.com/api/webhooks/` before proceeding.

            #### Windows Installer
            - Auto-detects TAT via the Windows app registry (no manual path hunting)
            - Feature flag checkboxes during setup
            - Clean uninstaller via Add/Remove Programs

            #### Trading-Day Rolling Benchmarks
            Rolling windows count **trading days**, not calendar days — weekends and market holidays are excluded automatically.

            #### Skip Closed-Market Days
            TradeScout detects when the market was closed (no trades and no DailyLog data) and exits silently.
          files: |
            TradeScout.7z
            TradeScout-Setup.exe
          make_latest: true
